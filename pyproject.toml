[project]
name = "paylab-sut"
version = "1.0.0"
description = "PayLab system under test: checkout service, web UI and mock payment provider"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "playwright>=1.64.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true
